name: Release Neo Engine

on:
  workflow_dispatch:
  push:
    tags:
      - "engine-neo-v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build Native Modules
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        arch: [x64, arm64]
        node: [24, 26]
        include:
          - os: ubuntu-latest
            os_name: linux
          - os: macos-latest
            os_name: darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Install ARM64 Cross-Compiler
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure and Build
        working-directory: ./engines/neo
        run: |
          pnpm run configure
          pnpm run build:${{ matrix.arch }}

      - name: Rename Binary for Release
        working-directory: ./engines/neo
        run: |
          mv build/Release/uws-wrapper-${{ matrix.arch }}.node uws-wrapper-${{ matrix.os_name }}-${{ matrix.arch }}-node${{ matrix.node }}.node

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uws-wrapper-${{ matrix.os_name }}-${{ matrix.arch }}-node${{ matrix.node }}
          path: ./engines/neo/uws-wrapper-${{ matrix.os_name }}-${{ matrix.arch }}-node${{ matrix.node }}.node

      - name: Upload NPM Package Dist
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: neo-npm-package
          path: ./engines/neo/dist

  release:
    name: Release Binaries
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./binaries/**/*.node
          name: ${{ github.ref_name }}
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Publish to NPM via Trusted Publishing
        run: pnpm publish --no-git-checks --provenance ./binaries/neo-npm-package
