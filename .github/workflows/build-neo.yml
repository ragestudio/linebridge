name: Release Neo Engine

on:
  workflow_dispatch:
  push:
    tags:
      - "engine-neo-v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build Native Modules
    strategy:
      matrix:
        # gitea only has self hosted linux runners
        os: ${{ fromJSON(github.server_url == 'https://github.com' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        arch: [x64, arm64]
        node: [24, 26]

    runs-on: ${{ matrix.os }}

    env:
      OS_NAME: ${{ startsWith(matrix.os, 'macos') && 'darwin' || 'linux' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Install ARM64 Cross-Compiler
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure and Build
        working-directory: ./engines/neo
        run: |
          pnpm run configure
          pnpm run build:${{ matrix.arch }}

      - name: Rename Binary for Release
        working-directory: ./engines/neo
        run: |
          mv build/Release/uws-wrapper-${{ matrix.arch }}.node uws-wrapper-${{ env.OS_NAME }}-${{ matrix.arch }}-node${{ matrix.node }}.node

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: uws-wrapper-${{ env.OS_NAME }}-${{ matrix.arch }}-node${{ matrix.node }}
          path: ./engines/neo/uws-wrapper-${{ env.OS_NAME }}-${{ matrix.arch }}-node${{ matrix.node }}.node

      - name: Upload NPM Package Dist
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64' && matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: neo-npm-package
          path: ./engines/neo/dist

  release:
    name: Release Binaries
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: uws-wrapper-*
          merge-multiple: true
          path: ./binaries

      - name: Download NPM package
        uses: actions/download-artifact@v8
        with:
          name: neo-npm-package
          path: ./neo-package

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.GITEA_TOKEN }}
        with:
          files: ./binaries/*.node
          name: ${{ github.ref_name }}
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      # github uses trusted publishing, gitea has no oidc so it needs a token
      - name: Publish to NPM via Trusted Publishing
        if: github.server_url == 'https://github.com'
        run: pnpm publish --no-git-checks --provenance ./neo-package

      - name: Publish to NPM with token
        if: github.server_url != 'https://github.com'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --no-git-checks ./neo-package
