name: Release Core Framework

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Configure and Build
        working-directory: ./server
        run: |
          pnpm run build

      - name: Upload NPM Package Dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./server/dist

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./dist

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.GITEA_TOKEN }}
        with:
          name: ${{ github.ref_name }}
          # gitea has no generate notes endpoint
          generate_release_notes: ${{ github.server_url == 'https://github.com' }}
          draft: false
          prerelease: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      # github uses trusted publishing, gitea has no oidc so it needs a token
      - name: Publish to NPM via Trusted Publishing
        if: github.server_url == 'https://github.com'
        run: pnpm publish --no-git-checks --provenance ./dist

      - name: Publish to NPM with token
        if: github.server_url != 'https://github.com'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --no-git-checks ./dist
