name: Release Gateway

on:
  workflow_dispatch:
  push:
    tags:
      - "gateway-v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  discussions: write
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup GoLang
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.0

      - name: Make binaries
        working-directory: ./gateway
        run: make binaries

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gateway-bins
          path: ./gateway/bin

  release:
    name: Release Binaries
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    env:
      GITEA_SERVER_URL: ${{ secrets.GITEA_SERVER_URL || 'https://git.ragestudio.net' }}
      GITEA_REPOSITORY: ${{ github.repository }}
      GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: gateway-bins
          path: gateway-bins

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            gateway-bins/*

          body: |
            ## New Release
            Automated build for ${{ github.ref_name }}

          prerelease: ${{ contains(github.ref_name, '-next') }}
          draft: false
          fail_on_unmatched_files: true
